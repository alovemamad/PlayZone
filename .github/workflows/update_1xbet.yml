name: Update 1xBet Live Data

on:
  schedule:
    - cron: '*/5 * * * *' # هر ۵ دقیقه یک بار اجرا شود
  workflow_dispatch: # دکمه‌ای برای اجرای دستی

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Script
        run: python update_1xbet.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add app/src/main/assets/live_matches.json
          git commit -m "Auto-update 1xbet data" || exit 0
          git push
